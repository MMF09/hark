<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Blockchain Forked</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        h1 { font-size: 120px; margin: 0; font-weight: 900; letter-spacing: 20px; color: #e67e22; text-shadow: 0 0 20px rgba(230, 126, 34, 0.5); }
        p { font-size: 20px; opacity: 0.8; margin-bottom: 30px; }
        
        .btn {
            padding: 12px 30px;
            border: 2px solid #e67e22;
            color: #e67e22;
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn:hover { background: #e67e22; color: white; box-shadow: 0 0 20px rgba(230, 126, 34, 0.4); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <h1>404</h1>
        <p>Giao thức không khớp. Khối dữ liệu này đã bị Fork sang một nhánh khác.</p>
        <a href="#" class="btn" onclick="location.reload()">Thử đồng bộ lại</a>
    </div>

    <!-- Import Three.js -->
    <script src="https://cloudflare.com"></script>

    <script>
        let scene, camera, renderer, particles;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Tạo các hạt (Particles) đại diện cho dữ liệu bị vỡ vụn
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 5000; i++) {
                vertices.push(THREE.MathUtils.randFloatSpread(20)); // x
                vertices.push(THREE.MathUtils.randFloatSpread(20)); // y
                vertices.push(THREE.MathUtils.randFloatSpread(20)); // z
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            const material = new THREE.PointsMaterial({ color: 0xe67e22, size: 0.05 });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += 0.001;
            particles.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        // Xử lý khi resize cửa sổ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuật Toán Hub - Quản Lý Thuật Toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .algorithm-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .algorithm-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .modal { animation: modalPop 0.3s ease-out forwards; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-white text-3xl font-bold">A</div>
                <h1 class="text-3xl font-bold text-gray-900 mt-6">Thuật Toán Hub</h1>
                <p class="text-gray-500 mt-2">Đăng nhập để quản lý</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tài khoản Admin</label>
                        <input type="text" id="username" value="admin" 
                               class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" 
                               class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400" required>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-600">
                        <label for="rememberMe" class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</label>
                    </div>
                </div>

                <button type="submit"
                        class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-semibold text-lg transition-colors">
                    Đăng Nhập
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 mt-6">
                Tài khoản mặc định: <span class="font-mono">admin / 123456</span>
            </div>
        </div>
    </div>

    <!-- Main App (ẩn ban đầu) -->
    <div id="mainApp" class="hidden flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-xl">A</div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Thuật Toán Hub</h1>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-red-500">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            
            <div class="p-4">
                <button onclick="showAddModal()" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-2xl flex items-center justify-center gap-2 font-medium">
                    <i class="fas fa-plus"></i>
                    <span>Thêm Thuật Toán Mới</span>
                </button>
            </div>

            <div class="px-4 mb-2">
                <input type="text" id="searchInput" 
                       onkeyup="filterAlgorithms()"
                       placeholder="Tìm kiếm thuật toán..." 
                       class="w-full px-4 py-3 bg-gray-100 border border-transparent focus:border-indigo-300 rounded-2xl outline-none text-sm">
            </div>

            <nav class="flex-1 overflow-y-auto px-3 py-2">
                <div onclick="filterByCategory('all')" class="category-item flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-gray-100 cursor-pointer bg-indigo-50 text-indigo-700 font-medium">
                    <i class="fas fa-th-large"></i>
                    <span>Tất cả thuật toán</span>
                </div>
            </nav>

            <div class="p-4 border-t text-xs text-gray-400">
                <p>Firebase • Admin Mode</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <header class="bg-white border-b h-16 flex items-center px-8 justify-between">
                <h2 id="pageTitle" class="text-2xl font-semibold text-gray-800">Tất cả Thuật Toán</h2>
                
                <div class="flex items-center gap-4">
                    <div class="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-3xl text-sm flex items-center gap-2">
                        <i class="fas fa-circle text-xs"></i>
                        <span>Đã đăng nhập</span>
                    </div>
                    <button onclick="refreshData()" class="px-4 py-2 text-gray-500 hover:text-gray-700">
                        <i class="fas fa-sync"></i>
                    </button>
                </div>
            </header>

            <div class="flex-1 p-8 overflow-auto" id="algorithmsContainer">
                <!-- Cards -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="modal bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
            <div class="px-8 py-6 border-b flex items-center justify-between">
                <h3 id="modalTitle" class="text-2xl font-semibold">Thêm Thuật Toán Mới</h3>
                <button onclick="hideModal()" class="text-3xl leading-none text-gray-400 hover:text-gray-600">×</button>
            </div>
            
            <div class="p-8 overflow-auto max-h-[calc(90vh-140px)]">
                <form id="algorithmForm" onsubmit="saveAlgorithm(event)">
                    <input type="hidden" id="editId">
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tên Thuật Toán</label>
                            <input type="text" id="name" required class="w-full px-5 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Danh Mục</label>
                            <select id="category" class="w-full px-5 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400">
                                <option value="Sorting">Sắp Xếp</option>
                                <option value="Searching">Tìm Kiếm</option>
                                <option value="Graph">Đồ Thị</option>
                                <option value="Dynamic">Quy Hoạch Động</option>
                                <option value="Other">Khác</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Độ Phức Tạp</label>
                            <input type="text" id="complexity" placeholder="O(n log n)" class="w-full px-5 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400">
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mô Tả</label>
                        <textarea id="description" rows="3" class="w-full px-5 py-3 border border-gray-200 rounded-3xl focus:outline-none focus:border-indigo-400"></textarea>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Code / Pseudocode</label>
                        <textarea id="code" rows="8" class="w-full px-5 py-4 font-mono text-sm border border-gray-200 rounded-3xl focus:outline-none focus:border-indigo-400"></textarea>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Các Bước Giải</label>
                        <div id="stepsContainer" class="space-y-3"></div>
                        <button type="button" onclick="addStepField()" class="mt-3 text-indigo-600 hover:text-indigo-700 text-sm flex items-center gap-1">
                            <i class="fas fa-plus"></i> Thêm bước
                        </button>
                    </div>
                </form>
            </div>

            <div class="px-8 py-5 border-t flex justify-end gap-3 bg-gray-50 rounded-b-3xl">
                <button onclick="hideModal()" class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-2xl font-medium">Hủy</button>
                <button onclick="saveAlgorithm()" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-medium">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // ================== FIREBASE CONFIG ==================
        const firebaseConfig = {
            databaseURL: "https://lotrinhchuyendi-default-rtdb.europe-west1.firebasedatabase.app",
            // Thêm apiKey, projectId,... nếu cần
        };

        let app, database;
        try {
            app = firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch (e) {
            console.error(e);
        }

        let algorithms = [];
        let currentEditId = null;
        const ADMIN_PASSWORD = "123456";
        const ADMIN_USERNAME = "admin";

        // ================== LOGIN ==================
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                const session = { loggedIn: true, username };
                if (remember) {
                    localStorage.setItem('adminSession', JSON.stringify(session));
                } else {
                    sessionStorage.setItem('adminSession', JSON.stringify(session));
                }
                showMainApp();
            } else {
                alert("Sai tài khoản hoặc mật khẩu!");
            }
        }

        function checkLogin() {
            const localSession = localStorage.getItem('adminSession');
            const sessionSession = sessionStorage.getItem('adminSession');
            
            if (localSession || sessionSession) {
                showMainApp();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('adminSession');
            sessionStorage.removeItem('adminSession');
            location.reload();
        }

        function showMainApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadAlgorithms();
        }

        // ================== CRUD ==================
        function loadAlgorithms() {
            if (!database) return;
            database.ref('algorithms').on('value', (snapshot) => {
                algorithms = [];
                snapshot.forEach(child => {
                    algorithms.push({ id: child.key, ...child.val() });
                });
                renderAlgorithms(algorithms);
            });
        }

        function renderAlgorithms(data) {
            const container = document.getElementById('algorithmsContainer');
            if (data.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-400">Chưa có thuật toán nào</div>`;
                return;
            }
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${data.map(algo => `
                        <div class="algorithm-card bg-white border border-gray-100 rounded-3xl overflow-hidden">
                            <div class="p-6">
                                <div class="flex justify-between">
                                    <span class="px-3 py-1 text-xs font-medium bg-indigo-100 text-indigo-700 rounded-2xl">${algo.category || 'Other'}</span>
                                    ${algo.complexity ? `<span class="text-xs text-gray-400">${algo.complexity}</span>` : ''}
                                </div>
                                <h3 class="mt-4 text-xl font-semibold">${algo.name}</h3>
                                <p class="mt-2 text-gray-600 line-clamp-3 text-sm">${algo.description || ''}</p>
                            </div>
                            <div class="border-t px-6 py-4 bg-gray-50 flex gap-2">
                                <button onclick="editAlgorithm('${algo.id}')" class="flex-1 py-3 text-sm font-medium border rounded-2xl hover:bg-white">Sửa</button>
                                <button onclick="deleteAlgorithm('${algo.id}')" class="flex-1 py-3 text-sm font-medium border border-red-200 text-red-600 rounded-2xl hover:bg-red-50">Xóa</button>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function filterAlgorithms() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = algorithms.filter(a => 
                a.name.toLowerCase().includes(term) || 
                (a.description && a.description.toLowerCase().includes(term))
            );
            renderAlgorithms(filtered);
        }

        function filterByCategory(cat) {
            document.getElementById('pageTitle').textContent = cat === 'all' ? 'Tất cả Thuật Toán' : cat;
            if (cat === 'all') renderAlgorithms(algorithms);
            else renderAlgorithms(algorithms.filter(a => a.category === cat));
        }

        function showAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Thêm Thuật Toán Mới';
            document.getElementById('algorithmForm').reset();
            document.getElementById('stepsContainer').innerHTML = '';
            addStepField();
            document.getElementById('modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function addStepField(value = '') {
            const container = document.getElementById('stepsContainer');
            const div = document.createElement('div');
            div.className = "flex gap-3 items-center";
            div.innerHTML = `
                <input type="text" value="${value}" placeholder="Mô tả bước..." 
                       class="flex-1 px-5 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:border-indigo-400">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 px-3">×</button>
            `;
            container.appendChild(div);
        }

        function saveAlgorithm(e) {
            if (e) e.preventDefault();
            const name = document.getElementById('name').value.trim();
            if (!name) return alert("Tên không được trống!");

            const steps = Array.from(document.getElementById('stepsContainer').querySelectorAll('input'))
                              .map(i => i.value.trim()).filter(Boolean);

            const data = {
                name,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value.trim(),
                code: document.getElementById('code').value.trim(),
                complexity: document.getElementById('complexity').value.trim(),
                steps: steps,
                updatedAt: Date.now()
            };

            const ref = database.ref('algorithms');
            if (currentEditId) {
                ref.child(currentEditId).update(data).then(() => { hideModal(); alert("Cập nhật thành công!"); });
            } else {
                ref.push(data).then(() => { hideModal(); alert("Thêm thành công!"); });
            }
        }

        function editAlgorithm(id) {
            const algo = algorithms.find(a => a.id === id);
            if (!algo) return;
            currentEditId = id;

            document.getElementById('modalTitle').textContent = 'Chỉnh sửa';
            document.getElementById('name').value = algo.name || '';
            document.getElementById('category').value = algo.category || 'Other';
            document.getElementById('description').value = algo.description || '';
            document.getElementById('code').value = algo.code || '';
            document.getElementById('complexity').value = algo.complexity || '';

            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';
            if (algo.steps && algo.steps.length) {
                algo.steps.forEach(s => addStepField(s));
            } else addStepField();

            document.getElementById('modal').classList.remove('hidden');
        }

        function deleteAlgorithm(id) {
            if (confirm("Xác nhận xóa?")) {
                database.ref('algorithms/' + id).remove()
                    .then(() => alert("Đã xóa!"));
            }
        }

        function refreshData() {
            loadAlgorithms();
        }

        // Khởi chạy
        window.onload = () => {
            checkLogin();
        };
    </script>
</body>
</html>
